[package]
name = "unft-wallet-core"
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Platform-neutral non-custodial wallet core for UNFTChain"
homepage = "https://www.unftchain.com/"
readme = "README.md"

[dependencies]
argon2 = { version = "0.5.3", features = ["zeroize"] }
base58ck = "0.1.0"
bech32 = "0.11.0"
bip39 = { version = "2.2.0", features = ["rand", "zeroize"] }
bitcoin = { version = "0.32.7", default-features = false, features = ["std", "secp-recovery", "rand-std"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
getrandom = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
